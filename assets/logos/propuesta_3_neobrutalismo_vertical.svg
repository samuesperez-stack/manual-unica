<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Sombra fondo -->
  <rect x="56" y="56" width="700" height="900" fill="#111827"/>
  <rect x="50" y="50" width="700" height="900" fill="#FFFFFF" stroke="#111827" stroke-width="6"/>
  <!-- Cabecera -->
  <rect x="50" y="50" width="700" height="160" fill="#0A257A"/>
  <text x="400" y="150" font-family="'Montserrat', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle">UNIÓN Y CAMBIO</text>
  <!-- Caja 1: QUÉ PASA -->
  <g transform="translate(90, 250)">
    <rect x="6" y="6" width="620" height="180" fill="#111827"/>
    <rect x="0" y="0" width="620" height="180" fill="#0A257A" stroke="#111827" stroke-width="4"/>
    <rect x="20" y="20" width="180" height="40" fill="#DCE817"/>
    <text x="110" y="48" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#0A257A" text-anchor="middle">1. ¿QUÉ PASA?</text>
    <text x="20" y="110" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">El dato objetivo del problema vecinal</text>
  </g>
  <!-- Caja 2: POR QUÉ PASA -->
  <g transform="translate(90, 480)">
    <rect x="6" y="6" width="620" height="180" fill="#111827"/>
    <rect x="0" y="0" width="620" height="180" fill="#E2E8F0" stroke="#111827" stroke-width="4"/>
    <rect x="20" y="20" width="220" height="40" fill="#111827"/>
    <text x="130" y="48" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">2. ¿POR QUÉ PASA?</text>
    <text x="20" y="110" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#111827">Explicación técnica de la causa real</text>
  </g>
  <!-- Caja 3: CÓMO SE RESUELVE -->
  <g transform="translate(90, 710)">
    <rect x="6" y="6" width="620" height="180" fill="#111827"/>
    <rect x="0" y="0" width="620" height="180" fill="#DCE817" stroke="#111827" stroke-width="4"/>
    <rect x="20" y="20" width="260" height="40" fill="#0A257A"/>
    <text x="150" y="48" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">3. ¿CÓMO SE RESUELVE?</text>
    <text x="20" y="110" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#0A257A">La solución viable de Unión y Cambio</text>
  </g>
</svg>