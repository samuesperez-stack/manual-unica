<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="800" height="800" fill="#FFFFFF"/>
  <!-- Emblema Solar Superior -->
  <circle cx="400" cy="180" r="100" fill="#C8D61A"/>
  <circle cx="400" cy="180" r="60" fill="#002AFF"/>
  <!-- UNIÓN Centrado -->
  <g fill="#002AFF" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="140" letter-spacing="-4">
    <text x="400" y="440" text-anchor="middle">UNIÓN</text>
  </g>
  <!-- Píldora Conjunción Y -->
  <rect x="365" y="480" width="70" height="40" rx="20" fill="#C8D61A"/>
  <text x="400" y="508" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#002AFF" text-anchor="middle">Y</text>
  <!-- CAMBIO Inferior -->
  <g fill="#002AFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="76" letter-spacing="16">
    <text x="400" y="620" text-anchor="middle">CAMBIO</text>
  </g>
  <rect x="250" y="670" width="300" height="8" rx="4" fill="#C8D61A"/>
</svg>